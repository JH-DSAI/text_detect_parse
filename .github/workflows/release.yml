name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  build:
    name: Build distributions
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tags are needed to derive the version
      - uses: astral-sh/setup-uv@v6
      - run: uv build
      - name: Check built version matches tag
        run: |
          uv run --no-project --with packaging python - <<'EOF'
          import email
          import glob
          import os
          import sys
          import tarfile
          import zipfile

          from packaging.version import Version

          expected = Version(os.environ["GITHUB_REF_NAME"].removeprefix("v"))

          (wheel,) = glob.glob("dist/*.whl")
          (sdist,) = glob.glob("dist/*.tar.gz")

          with zipfile.ZipFile(wheel) as zf:
              name = next(n for n in zf.namelist() if n.endswith(".dist-info/METADATA"))
              wheel_version = email.message_from_bytes(zf.read(name))["Version"]

          with tarfile.open(sdist) as tf:
              name = next(n for n in tf.getnames() if n.count("/") == 1 and n.endswith("/PKG-INFO"))
              sdist_version = email.message_from_bytes(tf.extractfile(name).read())["Version"]

          bad = [
              (path, v)
              for path, v in ((wheel, wheel_version), (sdist, sdist_version))
              if Version(v) != expected
          ]
          for path, v in bad:
              print(f"{path} has version {v}, tag expects {expected}", file=sys.stderr)
          sys.exit(1 if bad else 0)
          EOF
      - name: Smoke-test the built wheel
        run: uv run --no-project --isolated --with dist/*.whl text-detect-parse --help
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/text-detect-parse/
    permissions:
      id-token: write # required for trusted publishing (OIDC)
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: astral-sh/setup-uv@v6
      - run: uv publish --trusted-publishing always dist/*

  github-release:
    name: Publish GitHub release
    needs: [build, pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Create release with artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --repo "${GITHUB_REPOSITORY}" --title "${GITHUB_REF_NAME}" --generate-notes
