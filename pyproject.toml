[project]
name = "text-detect-parse"
dynamic = ["version"]
description = "Parse DOCX, PDF, and TXT documents into ordered blocks for LLM pipelines"
readme = "README.md"
authors = [
    { name = "Ryan Hausen", email = "ryan.hausen@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pymupdf>=1.28.2",
    "python-docx>=1.2.0",
]

[project.scripts]
text-detect-parse = "text_detect_parse.cli:main"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["src/text_detect_parse"]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.10",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["docx", "docx.*", "pymupdf"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["text_detect_parse.parser", "text_detect_parse.openai"]
disallow_untyped_calls = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=text_detect_parse --cov-report=term-missing --cov-fail-under=90"

[tool.coverage.run]
branch = true
